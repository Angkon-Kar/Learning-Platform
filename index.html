<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Learning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="book.png">

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container mx-auto p-4 md:p-8 flex flex-col min-h-screen">

        <header class="mb-10 pt-4 pb-6 border-b border-gray-200">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center space-y-4 md:space-y-0">

                <h1 class="text-4xl font-extrabold text-blue-600">My Learning Platform</h1>

                <div class="relative w-full md:w-80">
                    <input type="text" id="searchInput" placeholder="Search topics..." class="w-full py-2 pl-4 pr-10 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="clearSearchBtn" class="absolute right-0 top-0 mt-2 mr-3 text-gray-500 hidden hover:text-gray-700 transition-colors" style="display:none;">
                        &times;
                    </button>
                </div>
            </div>

            <div class="flex items-center space-x-4 mt-6">
                <button id="backButton" class="btn-secondary hidden text-lg px-4 py-2">
                    &larr; Back
                </button>
                <h2 id="currentCategoryTitle" class="text-3xl font-bold text-gray-800 hidden"></h2>
            </div>
        </header>

        <main id="content-container" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3 flex-grow mb-12"></main>
        <div id="noResultsMessage" class="hidden text-center text-xl text-gray-500 p-10">
            No results found matching your search criteria.
        </div>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            © 2025 My Learning Platform. All rights reserved.
        </footer>

    </div>

    <script type="module" src="script.js"></script>
    
</body>
</html>
